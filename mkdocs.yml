site_name: 學習筆記
site_url: https://bustlec.github.io/reading-notes/
repo_url: https://github.com/bustlec/reading-notes
use_directory_urls: false

theme:
  name: material
  language: zh-TW
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: 切換到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: 切換到淺色模式

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

plugins:
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

nav:
  - 首頁: index.md
  - 讀書筆記:
      - books/index.md
      - 心理與成長:
          - 心流: books/flow.md
      - 思維與決策:
          - 反脆弱: books/antifragile.md
      - 商業與職涯:
          - 執行長日記: books/diary-of-a-ceo.md
  - Java 面試:
      - java/index.md
      - 最高頻 15 題: java/top-15.md
      - Java 核心（必考）:
          - 0. 物件導向: java/oop.md
          - 1. Java 基礎: java/basics.md
          - 2. 執行緒: java/threads.md
          - 3. 集合框架: java/collections.md
          - 4. 垃圾回收 GC: java/gc.md
          - 5. 例外處理: java/exceptions.md
      - Java Web 與資料庫:
          - 8. JDBC: java/jdbc.md
          - 10. Servlet: java/servlet.md
          - 11. JSP: java/jsp.md
      - 已淘汰／少考:
          - 6. Applet: java/applet.md
          - 7. Swing / AWT: java/swing.md
          - 9. RMI 與序列化: java/rmi.md
